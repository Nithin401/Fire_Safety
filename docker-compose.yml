version: '3.8'

services:
  fireshield-backend:
    build: .
    container_name: fireshield_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      - DEVICE_INGESTION_API_KEY=fireshield_local_dev_key_2026
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceAccountKey.json
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./ml:/app/ml
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
